name: Publish verified pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified tag, for example v1.11.0-preview.2
        required: true
        type: string
      confirm:
        description: Type PUBLISH_WEALTHGROWTHTRACKER
        required: true
        type: string
      history_ack:
        description: Type HISTORY_P0_ACCEPTED only after the private history audit is explicitly accepted
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Require explicit safety acknowledgements
        env:
          CONFIRM: ${{ inputs.confirm }}
          HISTORY_ACK: ${{ inputs.history_ack }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$CONFIRM" = "PUBLISH_WEALTHGROWTHTRACKER"
          test "$HISTORY_ACK" = "HISTORY_P0_ACCEPTED"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
      - name: Verify tag belongs to trusted main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --force --tags origin
          tag_commit="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main
          echo "TAG_COMMIT=$tag_commit" >> "$GITHUB_ENV"
      - name: Require a complete Draft asset matrix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq --arg tag "$TAG" '.[] | select(.tag_name == $tag)' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"
          jq -e '.draft == true and .prerelease == true' "$RUNNER_TEMP/release.json" > /dev/null
          release_id="$(jq -r '.id' "$RUNNER_TEMP/release.json")"
          test -n "$release_id" && test "$release_id" != "null"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          jq -r '.assets[].name' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/assets.txt"
          for pattern in \
            '^WealthGrowthTracker_.*_x64-setup\.exe$' \
            '^WealthGrowthTracker_.*_universal\.dmg$' \
            '^WealthGrowthTracker_.*_amd64\.AppImage$' \
            '^WealthGrowthTracker_.*_amd64\.deb$' \
            '^WealthGrowthTracker-.*\.x86_64\.rpm$' \
            '^WealthGrowthTracker_.*_android-preview\.apk$' \
            '^WealthGrowthTracker_.*_web\.zip$' \
            '^SHA256SUMS\.txt$'; do
            if ! grep -Eq "$pattern" "$RUNNER_TEMP/assets.txt"; then
              echo "::error::Draft 缺少必需资产：$pattern"
              exit 1
            fi
          done
      - name: Recheck every downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          verify_dir="$RUNNER_TEMP/publish-assets-${GITHUB_RUN_ID}"
          mkdir -p "$verify_dir"
          jq -r '.assets[] | [.id, .name] | @tsv' "$RUNNER_TEMP/release.json" |
            while IFS=$'\t' read -r asset_id asset_name; do
              test -n "$asset_id" && test -n "$asset_name"
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$verify_dir/$asset_name"
            done
          (cd "$verify_dir" && sha256sum -c --strict SHA256SUMS.txt)
      - name: Publish the already verified Draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '{draft:.draft,prerelease:.prerelease,tagName:.tag_name,url:.html_url,assets:[.assets[].name]}'
