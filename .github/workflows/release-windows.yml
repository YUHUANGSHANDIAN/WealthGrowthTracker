name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Build Tauri app (NSIS + MSI) and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '财富成长记 ${{ github.ref_name }}'
          releaseBody: |
            ## 财富成长记 Windows 桌面版

            **版本**：${{ github.ref_name }}

            ### 下载安装
            下载 `WealthGrowthTracker_*_x64-setup.exe`（NSIS，推荐，按用户安装、无需管理员）或 `.msi` 安装即可。

            ### 数据保存位置
            所有资产数据默认保存在你自己的电脑：`文档\财富成长记\`（含 `data/`、`backups/`、`reports/`）。卸载应用不会删除该目录。

            ### 安全提示
            本安装包当前**未进行商业代码签名**，Windows SmartScreen 首次安装时可能提示「未知发布者」，点击「更多信息 → 仍要运行」即可。所有数据仅保存在本地，不上传服务器。

            ### 校验
            见附件 `SHA256SUMS.txt`。

          releaseDraft: false
          prerelease: false
          args: ''

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $files = Get-ChildItem -Path $bundle -Recurse -Include *.exe, *.msi
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath "$bundle\SHA256SUMS.txt" -Encoding ascii
          Get-Content "$bundle\SHA256SUMS.txt"

      - name: Upload checksums to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "src-tauri/target/release/bundle/SHA256SUMS.txt" --clobber
