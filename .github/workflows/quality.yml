name: Pull request and push checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WGT_BUILD_COMMIT: ${{ github.sha }}
  WGT_BUILD_ID: ${{ github.sha }}-ci

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: node --version
      - run: npm run brand:check
      - run: npm run license:check
      - run: npm run audit:high
      - run: npm run privacy:check
      - run: npm run privacy:test
      - run: npm run privacy:history
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run artifact:check -- dist
      - run: npm ci --prefix ai-runtime
      - run: npm test --prefix ai-runtime
      - run: npm run audit:high --prefix ai-runtime

  visual:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: npm run cargo-license:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify local cache path guards
        shell: pwsh
        run: ./scripts/test-local-cache.ps1
