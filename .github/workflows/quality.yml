name: Pull request and push checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  WGT_BUILD_COMMIT: ${{ github.sha }}
  WGT_BUILD_ID: ${{ github.sha }}-ci

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: node --version
      - run: npm run privacy:check
      - run: npm run privacy:test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix ai-runtime
      - run: npm test --prefix ai-runtime
      - name: Verify desktop packaging scripts
        run: |
          node scripts/fetch-node-sidecar.mjs
          node scripts/prepare-ai-runtime-resources.mjs

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify local cache path guards
        shell: pwsh
        run: ./scripts/test-local-cache.ps1
