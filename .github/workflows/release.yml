name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 附件直接上传到 GitHub Release，不再经过 Actions artifact 中转：
# 私有仓库的 artifact 存储配额会随多次发布累积并阻塞上传，Release 附件不受该配额影响。
# 因此每个平台构建完成后立即上传，最后的 Finalize 步骤只负责校验、校验值和发布。

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Privacy scanner regression tests
        run: npm run privacy:test
      - name: Web build
        run: npm run build
      - name: AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: AI runtime tests
        run: npm test --prefix ai-runtime
      - name: Privacy check
        run: npm run privacy:check
      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust test
        working-directory: src-tauri
        run: cargo test

  prepare:
    name: Prepare draft release
    needs: quality
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft prerelease that build jobs upload into
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it as the upload target."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "财富成长记 $GITHUB_REF_NAME" \
              --prerelease --draft \
              --notes "构建进行中：附件与校验值将在全部平台构建完成后补齐。"
          fi

  build-windows:
    name: Build Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar
        run: node scripts/fetch-node-sidecar.mjs
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: Build Tauri (NSIS + MSI)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json
      - name: Upload bundles to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi)
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::本次未产出 Windows 安装包。"; exit 0; fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  build-macos:
    name: Build macOS Universal
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar (universal)
        run: node scripts/fetch-node-sidecar.mjs --universal-darwin
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: Build Tauri (universal DMG)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json --target universal-apple-darwin
      - name: Upload bundles to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::本次未产出 macOS 安装包。"; exit 0; fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  build-linux:
    name: Build Linux x86_64
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          # linuxdeploy 自身是 AppImage，要么能挂 FUSE 要么用 APPIMAGE_EXTRACT_AND_RUN 自解压执行。
          # 这里显式安装并让失败可见：上一版带 `|| true` 把依赖缺失吞掉了，AppImage 静默消失。
          if sudo apt-get install -y libfuse2t64; then
            echo "libfuse2t64 installed"
          elif sudo apt-get install -y libfuse2; then
            echo "libfuse2 installed"
          else
            echo "::warning::libfuse2 未安装；AppImage 依赖自解压执行，失败也不会阻塞发布"
          fi
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar
        run: node scripts/fetch-node-sidecar.mjs
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: Build Tauri (DEB + RPM)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json --bundles deb,rpm
      - name: Build Tauri (AppImage, best effort)
        continue-on-error: true
        env:
          # 让 linuxdeploy 自解压执行，绕开 FUSE；NO_STRIP 规避大二进制 strip 失败。
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: npx tauri build --verbose --ci --config src-tauri/tauri.desktop.conf.json --bundles appimage
      - name: Upload bundles to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm)
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::本次未产出 Linux 包。"; exit 0; fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  build-android:
    name: Build Android
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Configure Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # 接受全部 SDK 许可证（修复 setup-android 动作的许可证交互失败）
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
      - run: npm ci
      - run: npm run build
      - name: Init Android project
        run: npx tauri android init
      - name: Build Android APK (debug-signed preview)
        run: npx tauri android build --debug --apk
      - name: Upload APK to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | sort)
          if [ ${#apks[@]} -eq 0 ]; then echo "::warning::本次未产出 Android APK。"; exit 0; fi
          cp "${apks[0]}" "WealthGrowthTracker_${VERSION}_android-preview.apk"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "WealthGrowthTracker_${VERSION}_android-preview.apk"

  build-web:
    name: Build Web / PWA
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package and upload the Web/PWA build
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f dist/index.html
          (cd dist && zip -r "../WealthGrowthTracker_${VERSION}_web.zip" .)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "WealthGrowthTracker_${VERSION}_web.zip"

  publish:
    name: Verify and publish the release
    # 任一平台构建失败时仍然发布已成功的附件；缺失平台在 notes 中如实列出。
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [prepare, build-windows, build-macos, build-linux, build-android, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern '*' || true
          ls -la release-assets
      - name: Require the Web/PWA package before publishing
        run: |
          if ls release-assets/*_web.zip > /dev/null 2>&1; then
            echo "Web/PWA 包已附带。"
          else
            echo "::error::Web/PWA 包未附到 Release，不予发布。"
            exit 1
          fi
      - name: Rebuild SHA256SUMS from the actual assets
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release-assets/SHA256SUMS.txt
      - name: Generate release notes with actual asset coverage
        run: |
          {
            echo "## 财富成长记 ${GITHUB_REF_NAME}（预发布 Preview）"
            echo ""
            echo "Local-First / Privacy-First 的个人财富管理工具。本版本为 **预发布（prerelease）**，不是正式版：功能可用，但订阅发布门与签名尚未满足，详见下方「未完成事项」。"
            echo ""
            echo "### 本版主要变化"
            echo "- **月度理财工作台（WealthGrowthPlanner）**：新增 \`#/monthly\` 七区工作台与分步向导；文档在本地解析并按 SHA256 幂等入库；每月一份正式会话，跨月结转携带来源会话与 revision，来源变更即标记过期且不自动改写。"
            echo "- **月度理财状态链路与导入纠正**：导入→extracting→reviewing、生成候选→ready（绑定策略版本）、确认→planned→confirmed 全部打通（此前确认按钮必然报「不允许的状态流转」）；提取器改为按表头定位列，不再把序号当市值；新增「清空自动提取的候选」与补录快照日。"
            echo "- **品牌统一为 WealthGrowthTracker**：窗口标题、PWA 名称、关于页与导出元数据一致；\`identifier\`、存储键、IndexedDB 库名与 Service Worker 缓存前缀保持不变，旧安装与旧数据可原地升级。"
            echo "- **AI 新增两条只读能力**：图片视觉提取（只有你显式声明可读图的连接才会收到图片）与网页研究检索（只抓取你给出的公网 HTTPS 链接，仅桌面可用）。"
            echo "- **含附件的单文件归档**：数据中心新增「导出含附件完整备份 / 导入含附件备份」；导出逐项校验哈希、缺失即整体失败，导入先全量校验再写入（任一项哈希不符整批拒绝），上限 64 MiB，只恢复附件内容而不创建会话。"
            echo "- **视觉与检索已接入界面**：「资料与对账」的图片行有「视觉识别」（结果只读、不写入会话），「情报与目标」可粘贴公网 HTTPS 链接做「联网检索」，需显式点「保存为研究记录」才落库。"
            echo "- **AI 默认关闭**，关闭时不启动运行时、不联网、不读取凭据。"
            echo ""
            echo "### 本次构建实际包含的附件"
            for check in "*.exe|Windows 安装包（NSIS）" "*.msi|Windows MSI" "*.dmg|macOS DMG" "*.AppImage|Linux AppImage" "*.deb|Linux DEB" "*.rpm|Linux RPM" "*android-preview.apk|Android APK（debug 签名预览）" "*_web.zip|Web/PWA 静态包"; do
              pattern="${check%%|*}"
              label="${check##*|}"
              if ls release-assets/$pattern >/dev/null 2>&1; then echo "- ✅ ${label}"; else echo "- ⚠️ 本次未包含：${label}（该平台构建失败或被跳过）"; fi
            done
            echo ""
            echo "### 签名状态（如实说明）"
            echo "- Windows：未代码签名，SmartScreen 会提示「未知发布者」。"
            echo "- macOS：未签名、未公证（ad-hoc），首次打开需在「系统设置 → 隐私与安全性」允许。"
            echo "- Linux：AppImage 未签名；DEB/RPM 为本地构建产物。"
            echo "- Android：APK 为 **debug 签名的预览版**，不是正式签名，请勿用于分发。"
            echo ""
            echo "### AI 状态（如实说明）"
            echo "- AI 默认关闭，核心功能完全离线；AI 需要你自己配置**合法**的连接（自有 API Key、本地模型或自建 HTTPS 网关）。"
            echo "- **两类合法订阅路径（OpenAI 开源应用订阅、GitHub Copilot 订阅）的真实认证 / 推理 / 撤销验收尚未完成**，界面保持“待资格验证”，不得视为已支持。"
            echo "- API Key、本地模型与 mock **不计入订阅发布门**；未配置连接时 AI 保持关闭。"
            echo "- 应用不读取 Codex / Claude / GitHub CLI 等其它程序的登录令牌，也不嵌入 OAuth 客户端密钥。"
            echo "- 图片视觉提取：仅当连接被显式声明为可读图时才发送图片（最多 4 张 PNG/JPEG/WebP，超限即失败关闭）；识别质量取决于你选的视觉模型，应用不做本地 OCR，本轮**未用真实账号验收**。"
            echo "- 网页研究检索：只抓取你显式给出的公网 HTTPS 链接，**仅桌面端可用**；Web/移动端如实提示不可用，模型不能自行生成 URL。本轮**未用真实来源验收**。"
            echo "- Windows 打包运行时冒烟**已通过**（status 帧返回 runtime=enabled / tools=[] / credentials=private-broker-memory-only；未配置连接时 infer 与 vision-extract 均返回 PROFILE_UNAVAILABLE；不带开关时退出码 2）。macOS/Linux/Android **未执行**，命令见 docs/PLATFORM_SUPPORT.md。"
            echo "- 桌面包内置官方 Node 24.21.0 sidecar 运行时（按官方 SHA256 校验）；若某平台未包含运行时，AI 会明确报 AI_RUNTIME_MISSING。"
            echo ""
            echo "### 未完成事项（本版不宣称已具备）"
            echo "- 两类合法订阅路径的真实认证 / 推理 / 撤销验收：**未完成**（因此本版只能作为 prerelease 发布）。"
            echo "- Windows 未代码签名，macOS 未签名未公证；Android 若出现在上方附件中即为 **debug 签名预览版**，若未出现则表示本次未构建（缺 Android SDK/NDK 或构建失败）。"
            echo "- 视觉提取与网页检索的**真实账号验收未执行**：界面入口与验收清单（docs/AI_ACCEPTANCE.md）已就绪，需用户用自己的 API Key 跑一次并回填结果。"
            echo "- macOS / Linux / Android 安装后的 AI 冒烟仍需在对应系统人工确认（命令见 docs/PLATFORM_SUPPORT.md）。"
            echo ""
            echo "### 数据与隐私"
            echo "- 本 Release **不包含任何用户数据**、报告、备份或迁移脚本；附件仅为程序与校验文件。"
            echo "- 桌面端数据位于 \`文档\\财富成长记\\\`（卸载不删除）；Web 端位于浏览器 IndexedDB；Android 为应用专属目录。"
            echo "- 校验：见附件 \`SHA256SUMS.txt\`。"
            echo ""
            echo "> 预测/报告仅供个人参考，不构成投资建议。"
          } > release-notes.md
          cat release-notes.md
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "财富成长记 $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --prerelease --draft=false
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url,assets \
            --jq '{draft:.isDraft,prerelease:.isPrerelease,url:.url,assets:[.assets[].name]}'
