name: Release Draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  WGT_BUILD_COMMIT: ${{ github.sha }}
  WGT_BUILD_ID: ${{ github.sha }}-release

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false

# Attachments go directly into the Draft Release and do not consume Actions
# artifact storage. This workflow never performs the final publication.

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Brand contract
        run: npm run brand:check
      - name: Third-party license metadata
        run: npm run license:check
      - name: Cargo license metadata
        run: npm run cargo-license:check
      - name: High-severity dependency audit
        run: npm run audit:high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Privacy scanner regression tests
        run: npm run privacy:test
      - name: Web build
        run: npm run build
      - name: Web artifact privacy
        run: npm run artifact:check -- dist
      - name: AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: AI runtime tests
        run: npm test --prefix ai-runtime
      - name: AI runtime high-severity audit
        run: npm run audit:high --prefix ai-runtime
      - name: Privacy check
        run: npm run privacy:check
      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust test
        working-directory: src-tauri
        run: cargo test

  prepare:
    name: Prepare draft release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create the draft prerelease that build jobs upload into
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; refusing to reuse it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WealthGrowthTracker $GITHUB_REF_NAME" \
            --prerelease --draft \
            --notes "Draft 构建中：附件和 SHA-256 尚待全部平台完成。"

  build-windows:
    name: Build Windows x64
    needs: [quality, prepare]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - run: rustup default stable
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar
        run: node scripts/fetch-node-sidecar.mjs
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: AI runtime artifact privacy
        run: npm run artifact:check -- .ai-runtime-build/resources
      - name: Build Tauri (NSIS)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json --bundles nsis
      - name: Verify isolated legacy installation upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $candidate = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $candidate) { throw '未生成 Windows 安装包' }
          ./scripts/verify-windows-install.ps1 -CandidateInstaller $candidate.FullName
      - name: Upload bundles to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe)
          test ${#files[@]} -gt 0
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${files[@]}"

  build-macos:
    name: Build macOS Universal
    needs: [quality, prepare]
    runs-on: macos-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup default stable
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar (universal)
        run: node scripts/fetch-node-sidecar.mjs --universal-darwin
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: AI runtime artifact privacy
        run: npm run artifact:check -- .ai-runtime-build/resources
      - name: Build Tauri (universal DMG)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json --target universal-apple-darwin
      - name: Upload bundles to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          test ${#files[@]} -ge 1
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${files[@]}"

  build-linux:
    name: Build Linux x86_64
    needs: [quality, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          # linuxdeploy 自身是 AppImage，要么能挂 FUSE 要么用 APPIMAGE_EXTRACT_AND_RUN 自解压执行。
          # 这里显式安装并让失败可见：上一版带 `|| true` 把依赖缺失吞掉了，AppImage 静默消失。
          if sudo apt-get install -y libfuse2t64; then
            echo "libfuse2t64 installed"
          elif sudo apt-get install -y libfuse2; then
            echo "libfuse2 installed"
          else
            echo "::warning::libfuse2 未安装；AppImage 依赖自解压执行，失败也不会阻塞发布"
          fi
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar
        run: node scripts/fetch-node-sidecar.mjs
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: AI runtime artifact privacy
        run: npm run artifact:check -- .ai-runtime-build/resources
      - name: Build Tauri (DEB + RPM)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json --bundles deb,rpm
      - name: Build Tauri (AppImage)
        env:
          # 让 linuxdeploy 自解压执行，绕开 FUSE；NO_STRIP 规避大二进制 strip 失败。
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: npx tauri build --verbose --ci --config src-tauri/tauri.desktop.conf.json --bundles appimage
      - name: Upload bundles to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm)
          test ${#files[@]} -ge 3
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${files[@]}"

  build-android:
    name: Build Android
    needs: [quality, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: rustup default stable
      - name: Configure Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # 接受全部 SDK 许可证（修复 setup-android 动作的许可证交互失败）
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
      - run: npm ci
      - run: npm run build
      - run: npm run artifact:check -- dist
      - name: Init Android project
        run: npx tauri android init
      - name: Build Android APK (debug-signed preview)
        run: npx tauri android build --debug --apk
      - name: Upload APK to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | sort)
          test ${#apks[@]} -gt 0
          cp "${apks[0]}" "WealthGrowthTracker_${VERSION}_android-preview.apk"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "WealthGrowthTracker_${VERSION}_android-preview.apk"

  build-web:
    name: Build Web / PWA
    needs: [quality, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run artifact:check -- dist
      - name: Package and upload the Web/PWA build
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f dist/index.html
          (cd dist && zip -r "../WealthGrowthTracker_${VERSION}_web.zip" .)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "WealthGrowthTracker_${VERSION}_web.zip"

  publish:
    name: Verify and finalize the Draft
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [prepare, build-windows, build-macos, build-linux, build-android, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download the uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_dir="$RUNNER_TEMP/release-assets-${GITHUB_RUN_ID}"
          mkdir -p "$asset_dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$asset_dir" --pattern '*'
          echo "ASSET_DIR=$asset_dir" >> "$GITHUB_ENV"
      - name: Require the complete asset matrix
        run: |
          for pattern in \
            'WealthGrowthTracker_*_x64-setup.exe' \
            'WealthGrowthTracker_*_universal.dmg' \
            'WealthGrowthTracker_*_amd64.AppImage' \
            'WealthGrowthTracker_*_amd64.deb' \
            'WealthGrowthTracker-*.x86_64.rpm' \
            'WealthGrowthTracker_*_android-preview.apk' \
            'WealthGrowthTracker_*_web.zip'; do
            if ! compgen -G "$ASSET_DIR/$pattern" > /dev/null; then
              echo "::error::Draft 缺少必需资产：$pattern"
              exit 1
            fi
          done
      - name: Rebuild SHA256SUMS from the actual assets
        run: |
          checksum_tmp="$RUNNER_TEMP/SHA256SUMS-${GITHUB_RUN_ID}.txt"
          (cd "$ASSET_DIR" && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum) > "$checksum_tmp"
          mv "$checksum_tmp" "$ASSET_DIR/SHA256SUMS.txt"
          (cd "$ASSET_DIR" && sha256sum -c --strict SHA256SUMS.txt)
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$ASSET_DIR/SHA256SUMS.txt"
      - name: Generate Draft release notes
        run: |
          {
            echo "## WealthGrowthTracker ${GITHUB_REF_NAME}（预发布 Draft）"
            echo ""
            echo "Local-First / Privacy-First 的个人财富管理工具。本版本是等待人工验签、Windows 安装验收和安全放行确认的 **Draft Pre-release**。"
            echo ""
            echo "### 本版主要变化"
            echo "- **统一理财工作台**：初始对账、月度复盘、临时调仓、基金分析、止盈审查、市场情报、专项研究七类任务；正式月记录与独立临时任务分离，confirm/review/archive 可追溯。"
            echo "- **五主入口与深链兼容**：总览 / 资产 / 理财 / 复盘 / 规划，彩票和设置作为辅助入口；旧 hash 与实体链接继续可用。"
            echo "- **AI 连接治理**：每条连接独立启停，当前连接持久化；切换不影响其他连接的在途任务，停用只取消目标连接，迟到结果不落库。"
            echo "- **完整备份**：新增可独立恢复的 \`.wgtbackup.zip\`，包含主状态、任务、证据引用与原始附件；结构备份和附件导出保持独立。"
            echo "- **二进制附件与逐项健康修复**：旧 Base64 附件在哈希验证后迁移；不再提供盲目的“一键修复全部”。"
            echo "- **构建路径与身份**：本地使用 WealthGrowthTracker DevCache，脚本拒绝退役根；关于页显示构建身份与短提交。"
            echo "- **AI 默认关闭**，关闭时不启动运行时、不联网、不读取凭据。"
            echo ""
            echo "### 本次构建实际包含的附件"
            for check in "*.exe|Windows 安装包（NSIS）" "*.dmg|macOS DMG" "*.AppImage|Linux AppImage" "*.deb|Linux DEB" "*.rpm|Linux RPM" "*android-preview.apk|Android APK（debug 签名预览）" "*_web.zip|Web/PWA 静态包"; do
              pattern="${check%%|*}"
              label="${check##*|}"
              if ls "$ASSET_DIR"/$pattern >/dev/null 2>&1; then echo "- ✅ ${label}"; else echo "- ⚠️ 本次未包含：${label}"; fi
            done
            echo ""
            echo "### 签名状态（如实说明）"
            echo "- Windows：未代码签名，SmartScreen 会提示「未知发布者」。"
            echo "- macOS：未签名、未公证（ad-hoc），首次打开需在「系统设置 → 隐私与安全性」允许。"
            echo "- Linux：AppImage、DEB/RPM 来自标准 GitHub CI，均未签名。"
            echo "- Android：APK 为 **debug 签名的预览版**，不是正式签名，请勿用于分发。"
            echo ""
            echo "### AI 状态（如实说明）"
            echo "- AI 默认关闭，核心功能完全离线；AI 需要你自己配置**合法**的连接（自有 API Key、本地模型或自建 HTTPS 网关）。"
            echo "- **两类合法订阅路径（OpenAI 开源应用订阅、GitHub Copilot 订阅）的真实认证 / 推理 / 撤销验收尚未完成**，界面保持“待资格验证”，不得视为已支持。"
            echo "- API Key、本地模型与 mock **不计入订阅发布门**；未配置连接时 AI 保持关闭。"
            echo "- 应用不读取 Codex / Claude / GitHub CLI 等其它程序的登录令牌，也不嵌入 OAuth 客户端密钥。"
            echo "- 图片视觉提取：仅当连接被显式声明为可读图时才发送图片（最多 4 张 PNG/JPEG/WebP，超限即失败关闭）；识别质量取决于你选的视觉模型，应用不做本地 OCR。"
            echo "- 网页研究检索：只抓取你显式给出的公网 HTTPS 链接，**仅桌面端可用**；Web/移动端如实提示不可用，模型不能自行生成 URL。"
            echo "- 是否完成真实认证、推理、视觉、研究和安装版热切换，以交付记录为准；configure/CLI/mock 成功不能替代真实 GUI 验收。"
            echo "- 桌面包内置官方 Node 24.21.0 sidecar 运行时（按官方 SHA256 校验）；若某平台未包含运行时，AI 会明确报 AI_RUNTIME_MISSING。"
            echo ""
            echo "### 未完成事项（本版不宣称已具备）"
            echo "- 两类合法订阅路径的真实认证 / 推理 / 撤销验收：**未完成**（因此本版只能作为 prerelease 发布）。"
            echo "- Windows 未代码签名，macOS 未签名未公证；Android 若出现在上方附件中即为 **debug 签名预览版**，若未出现则表示本次未构建（缺 Android SDK/NDK 或构建失败）。"
            echo "- 视觉提取、网页研究与安装版热切换若未取得真实授权连接，会保持“未验证”状态。"
            echo "- macOS / Linux / Android 安装后的 AI 冒烟仍需在对应系统人工确认（命令见 docs/PLATFORM_SUPPORT.md）。"
            echo ""
            echo "### 数据与隐私"
            echo "- 本 Release **不包含任何用户数据**、报告、备份或迁移脚本；附件仅为程序与校验文件。"
            echo "- 桌面端数据位于当前设置的数据根（卸载不删除）；Web 端位于浏览器 IndexedDB；Android 为应用专属目录。"
            echo "- 校验：见附件 \`SHA256SUMS.txt\`。"
            echo ""
            echo "> 预测/报告仅供个人参考，不构成投资建议。"
          } > release-notes.md
          cat release-notes.md
      - name: Keep the verified release in Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "WealthGrowthTracker $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --prerelease --draft=true
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url,assets \
            --jq '{draft:.isDraft,prerelease:.isPrerelease,url:.url,assets:[.assets[].name]}'
