name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Privacy scanner regression tests
        run: npm run privacy:test
      - name: Web build
        run: npm run build
      - name: Privacy check
        run: npm run privacy:check
      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust test
        working-directory: src-tauri
        run: cargo test

  build-windows:
    name: Build Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar
        run: node scripts/fetch-node-sidecar.mjs
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: Build Tauri (NSIS + MSI)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS Universal
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar (universal)
        run: node scripts/fetch-node-sidecar.mjs --universal-darwin
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: Build Tauri (universal DMG)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json --target universal-apple-darwin
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

  build-linux:
    name: Build Linux x86_64
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - run: npm ci
      - name: Install AI runtime dependencies
        run: npm ci --prefix ai-runtime
      - name: Fetch bundled Node sidecar
        run: node scripts/fetch-node-sidecar.mjs
      - name: Prepare AI runtime resources
        run: node scripts/prepare-ai-runtime-resources.mjs
      - name: Build Tauri (DEB + RPM)
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json --bundles deb,rpm
      - name: Build Tauri (AppImage, best effort)
        continue-on-error: true
        run: npx tauri build --ci --config src-tauri/tauri.desktop.conf.json --bundles appimage
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-android:
    name: Build Android
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Configure Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # 接受全部 SDK 许可证（修复 setup-android 动作的许可证交互失败）
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
      - run: npm ci
      - run: npm run build
      - name: Init Android project
        run: npx tauri android init
      - name: Build Android APK (debug-signed preview)
        run: npx tauri android build --debug --apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  build-web:
    name: Build Web / PWA
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  publish:
    name: Publish Release
    # 任一平台构建失败时仍然发布已成功的附件；缺失平台在 notes 中如实列出。
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-windows, build-macos, build-linux, build-android, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the quality gate to have passed
        run: |
          test "${{ needs.build-web.result }}" = "success"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files and SHA256SUMS
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.apk' -o -name '*.app.tar.gz' \) -exec cp {} release-assets/ \;
          VERSION="${GITHUB_REF_NAME#v}"
          test -f artifacts/web-dist/index.html
          (cd artifacts/web-dist && zip -r "../../release-assets/WealthGrowthTracker_${VERSION}_web.zip" .)
          for f in release-assets/*.apk; do [ -e "$f" ] && mv "$f" "release-assets/WealthGrowthTracker_${VERSION}_android-preview.apk"; done
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: Generate release notes with actual asset coverage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## 财富成长记 ${GITHUB_REF_NAME}（预发布 Preview）"
            echo ""
            echo "Local-First / Privacy-First 的个人财富管理工具。本版本为 **预发布**，用于体验 v1.7.0 的工作台重构与受控 AI 能力，不构成正式版。"
            echo ""
            echo "### 本次构建实际包含的附件"
            for check in "*.exe|Windows 安装包（NSIS）" "*.msi|Windows MSI" "*.dmg|macOS DMG" "*.AppImage|Linux AppImage" "*.deb|Linux DEB" "*.rpm|Linux RPM" "*android-preview.apk|Android APK（debug 签名预览）" "*_web.zip|Web/PWA 静态包"; do
              pattern="${check%%|*}"
              label="${check##*|}"
              if ls release-assets/$pattern >/dev/null 2>&1; then echo "- ✅ ${label}"; else echo "- ⚠️ 本次未包含：${label}（该平台构建失败或被跳过）"; fi
            done
            echo ""
            echo "### 签名状态（如实说明）"
            echo "- Windows：未代码签名，SmartScreen 会提示「未知发布者」。"
            echo "- macOS：未签名、未公证（ad-hoc），首次打开需在「系统设置 → 隐私与安全性」允许。"
            echo "- Linux：AppImage 未签名；DEB/RPM 为本地构建产物。"
            echo "- Android：APK 为 **debug 签名的预览版**，不是正式签名，请勿用于分发。"
            echo ""
            echo "### AI 状态（如实说明）"
            echo "- AI 默认关闭，核心功能完全离线；AI 需要你自己配置**合法**的连接（自有 API Key、本地模型或自建 HTTPS 网关）。"
            echo "- **两类合法订阅路径（OpenAI 开源应用订阅、GitHub Copilot 订阅）的真实认证 / 推理 / 撤销验收尚未完成**，界面保持“待资格验证”，不得视为已支持。"
            echo "- API Key、本地模型与 mock **不计入订阅发布门**；未配置连接时 AI 保持关闭。"
            echo "- 应用不读取 Codex / Claude / GitHub CLI 等其它程序的登录令牌，也不嵌入 OAuth 客户端密钥。"
            echo "- 桌面包内置官方 Node 24.21.0 sidecar 运行时（按官方 SHA256 校验）；若某平台未包含运行时，AI 会明确报 AI_RUNTIME_MISSING。"
            echo ""
            echo "### 数据与隐私"
            echo "- 本 Release **不包含任何用户数据**、报告、备份或迁移脚本；附件仅为程序与校验文件。"
            echo "- 桌面端数据位于 \`文档\\\\财富成长记\\\\\`（卸载不删除）；Web 端位于浏览器 IndexedDB；Android 为应用专属目录。"
            echo "- 校验：见附件 \`SHA256SUMS.txt\`。"
            echo ""
            echo "> 预测/报告仅供个人参考，不构成投资建议。"
          } > release-notes.md
          cat release-notes.md
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: '财富成长记 ${{ github.ref_name }}'
          body_path: release-notes.md
          files: release-assets/*
          # Full release remains gated by real subscription acceptance, licensing and artifact audit.
          draft: true
          prerelease: true
