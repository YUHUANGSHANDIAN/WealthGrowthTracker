[package]
name = "wealthgrowthtracker"
version = "1.11.0-preview.2"
description = "WealthGrowthTracker — 本地优先的个人财富管理桌面应用"
authors = ["YUHUANGSHANDIAN"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "wealthgrowthtracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
fs2 = "=0.4.3"
sha2 = "=0.10.9"
keyring = "=4.2.0"
tauri-plugin-shell = "=2.3.3"
base64 = "=0.22.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
