[package]
name = "wealth-growth-tracker"
version = "1.1.0"
description = "财富成长记 / Wealth Growth Tracker —— 本地个人财富管理桌面应用"
authors = ["YUHUANGSHANDIAN"]
edition = "2021"

[lib]
name = "wealth_growth_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
